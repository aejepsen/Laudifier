[pytest]
pythonpath = ..
testpaths = tests
asyncio_mode = strict
addopts =
    --strict-markers
    --strict-config
    -ra
    --cov=backend
    --cov-branch
    --cov-report=term-missing:skip-covered
    --cov-report=xml:coverage.xml
    --cov-report=html:htmlcov
    --cov-fail-under=80
markers =
    integration: testes que batem em serviços reais (rede, disco)
    concurrency: property-based tests de concorrência (hypothesis)
    slow: testes lentos (> 1s)
filterwarnings =
    error
    ignore::DeprecationWarning:pydantic.*
    ignore::DeprecationWarning:httpx.*
