name: Laudifier — CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_mutation:
        description: "Rodar mutation testing (mutmut)"
        type: boolean
        default: false

jobs:

  # ─── 1. Testes ──────────────────────────────────────────────────────────────
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.9.4
        ports: ["6333:6333"]
    steps:
      - uses: actions/checkout@v4

      - name: Aguardar Qdrant iniciar
        run: |
          echo "Aguardando Qdrant..."
          for i in $(seq 1 20); do
            curl -sf http://localhost:6333/readyz && echo "Qdrant pronto!" && break
            echo "Tentativa $i/20 — aguardando 5s..."
            sleep 5
          done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar torch CPU-only (evita CUDA ~5GB)
        run: pip install torch==2.5.1+cpu --extra-index-url https://download.pytorch.org/whl/cpu

      - run: pip install -r backend/requirements.txt pytest pytest-asyncio pytest-cov httpx hypothesis

      - name: Dependency audit
        run: |
          pip install pip-audit -q
          pip-audit --requirement backend/requirements.txt --skip-editable \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple

      - name: Run tests with coverage gate (≥ 80%)
        run: |
          pytest backend/tests/ -v --tb=short \
            --cov=backend --cov-branch \
            --cov-report=term-missing --cov-report=xml \
            --cov-fail-under=80
        env:
          ANTHROPIC_API_KEY:         ${{ secrets.ANTHROPIC_API_KEY }}
          QDRANT_URL:                http://localhost:6333
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY:         ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JWT_SECRET:                ${{ secrets.JWT_SECRET }}
          MEM0_API_KEY:              ${{ secrets.MEM0_API_KEY }}
          USE_LOCAL_STORAGE:         "true"
          APP_ENV:                   "development"

      - name: Upload coverage XML (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn


  # ─── 1b. Mutation testing (manual via workflow_dispatch) ────────────────────
  mutation-test:
    name: Mutation Test (agents/)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.run_mutation == true
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar torch CPU-only
        run: pip install torch==2.5.1+cpu --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Instalar dependências + mutmut
        run: |
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx hypothesis mutmut

      - name: Run mutmut em backend/agents/ (config em setup.cfg)
        env:
          MEM0_API_KEY:      "stub"
          ANTHROPIC_API_KEY: "stub"
          QDRANT_URL:        "http://localhost:6333"
          USE_LOCAL_STORAGE: "true"
        run: |
          mutmut run || true
          mutmut results | tee mutmut-results.txt

      - name: Verificar kill rate ≥ 70%
        run: |
          python - <<'PY'
          import re, sys, pathlib
          out = pathlib.Path("mutmut-results.txt").read_text()
          killed   = len(re.findall(r'^\d+\s+killed', out, re.M))
          survived = len(re.findall(r'^\d+\s+survived', out, re.M))
          total = killed + survived
          rate = killed / total if total else 0.0
          print(f"Mutation kill rate: {rate:.1%} ({killed}/{total})")
          sys.exit(0 if rate >= 0.70 else 1)
          PY


  # ─── 2. Deploy → OCI VM (Ampere A1) ─────────────────────────────────────────
  # SSH na VM, git pull, rebuild containers, restart stack.
  # Build nativo ARM (cross-arch x86→arm64 lento/caro p/ pytorch+whisper).
  deploy-oci:
    name: Deploy → OCI Ampere
    runs-on: ubuntu-latest
    needs: [test-backend]
    if: github.ref == 'refs/heads/main'
    environment: production
    timeout-minutes: 30
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.OCI_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.OCI_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Pull + rebuild + restart
        run: |
          ssh -i ~/.ssh/id_ed25519 \
              -o StrictHostKeyChecking=no \
              ${{ secrets.OCI_USER }}@${{ secrets.OCI_HOST }} \
              'set -euo pipefail
               cd /opt/laudifier/repo
               sudo -u ubuntu git pull --ff-only origin main
               # environment.ts gitignored — semeia a partir de example
               cp -n src/environments/environment.example.ts src/environments/environment.ts || true
               cd /opt/laudifier
               sudo docker compose -f docker-compose.prod.yml build
               sudo docker compose -f docker-compose.prod.yml up -d
               sudo docker compose -f docker-compose.prod.yml ps'

      - name: Health check pós-deploy
        run: |
          echo "Aguardando backend warm-up (Whisper + Qdrant)..."
          for i in $(seq 1 30); do
            if curl -fsS https://laudifier.com.br/health/ready > /dev/null; then
              echo "Backend ready (tentativa $i)"
              exit 0
            fi
            echo "Tentativa $i/30 — aguardando 10s..."
            sleep 10
          done
          echo "Health check falhou após 5min" >&2
          exit 1
