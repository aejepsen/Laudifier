name: Laudifier — CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_mutation:
        description: "Rodar mutation testing (mutmut)"
        type: boolean
        default: false

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/laudifier-backend

jobs:

  # ─── 1. Testes ──────────────────────────────────────────────────────────────
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.9.4
        ports: ["6333:6333"]
    steps:
      - uses: actions/checkout@v4

      - name: Aguardar Qdrant iniciar
        run: |
          echo "Aguardando Qdrant..."
          for i in $(seq 1 20); do
            curl -sf http://localhost:6333/readyz && echo "Qdrant pronto!" && break
            echo "Tentativa $i/20 — aguardando 5s..."
            sleep 5
          done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar torch CPU-only (evita CUDA ~5GB)
        run: pip install torch==2.5.1+cpu --extra-index-url https://download.pytorch.org/whl/cpu

      - run: pip install -r backend/requirements.txt pytest pytest-asyncio pytest-cov httpx hypothesis

      - name: Dependency audit
        run: |
          pip install pip-audit -q
          pip-audit --requirement backend/requirements.txt --skip-editable \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple

      - name: Run tests with coverage gate (≥ 80%)
        run: |
          pytest backend/tests/ -v --tb=short \
            --cov=backend --cov-branch \
            --cov-report=term-missing --cov-report=xml \
            --cov-fail-under=80
        env:
          ANTHROPIC_API_KEY:         ${{ secrets.ANTHROPIC_API_KEY }}
          QDRANT_URL:                http://localhost:6333
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY:         ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JWT_SECRET:                ${{ secrets.JWT_SECRET }}
          MEM0_API_KEY:              ${{ secrets.MEM0_API_KEY }}
          USE_LOCAL_STORAGE:         "true"
          APP_ENV:                   "development"

      - name: Upload coverage XML (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn


  # ─── 1b. Mutation testing (manual via workflow_dispatch) ────────────────────
  mutation-test:
    name: Mutation Test (agents/)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.run_mutation == true
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar torch CPU-only
        run: pip install torch==2.5.1+cpu --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Instalar dependências + mutmut
        run: |
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx hypothesis mutmut

      - name: Run mutmut em backend/agents/ (config em setup.cfg)
        env:
          MEM0_API_KEY:      "stub"
          ANTHROPIC_API_KEY: "stub"
          QDRANT_URL:        "http://localhost:6333"
          USE_LOCAL_STORAGE: "true"
        run: |
          mutmut run || true
          mutmut results | tee mutmut-results.txt

      - name: Verificar kill rate ≥ 70%
        run: |
          python - <<'PY'
          import re, sys, pathlib
          out = pathlib.Path("mutmut-results.txt").read_text()
          killed   = len(re.findall(r'^\d+\s+killed', out, re.M))
          survived = len(re.findall(r'^\d+\s+survived', out, re.M))
          total = killed + survived
          rate = killed / total if total else 0.0
          print(f"Mutation kill rate: {rate:.1%} ({killed}/{total})")
          sys.exit(0 if rate >= 0.70 else 1)
          PY


  # ─── 2. Build + Push → Docker Hub ───────────────────────────────────────────
  build-push:
    name: Build & Push → Docker Hub
    runs-on: ubuntu-latest
    needs: [test-backend]
    if: github.ref == 'refs/heads/main'
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Docker metadata (sha curto + latest)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=true

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Buildx (layer cache via GitHub Actions cache)
        uses: docker/setup-buildx-action@v3

      - name: Build e push
        uses: docker/build-push-action@v5
        with:
          context:    ./backend
          push:       true
          tags:       ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max


  # ─── 3. Deploy Backend → Azure Container Apps ───────────────────────────────
  deploy-backend:
    name: Deploy Backend → Azure Container Apps
    runs-on: ubuntu-latest
    needs: [build-push]
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Login Azure via OIDC (sem credenciais estáticas)
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Aguardar provisionamento anterior (se houver)
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            echo "Verificando estado do Container App..."
            for i in $(seq 1 24); do
              STATE=$(az containerapp show \
                --name laudifier-production-backend \
                --resource-group rg-laudifier-production \
                --query "properties.provisioningState" -o tsv 2>/dev/null || echo "Unknown")
              echo "Estado atual: $STATE (tentativa $i/24)"
              if [ "$STATE" = "Succeeded" ] || [ "$STATE" = "Failed" ] || [ "$STATE" = "Canceled" ]; then
                echo "Container App disponível. Prosseguindo..."
                break
              fi
              sleep 15
            done

      - name: Atualizar imagem no Container App
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            az containerapp registry set \
              --name          laudifier-production-backend \
              --resource-group rg-laudifier-production \
              --server        docker.io \
              --username      ${{ secrets.DOCKERHUB_USERNAME }} \
              --password      ${{ secrets.DOCKERHUB_TOKEN }}
            az containerapp update \
              --name         laudifier-production-backend \
              --resource-group rg-laudifier-production \
              --image        docker.io/${{ env.IMAGE_NAME }}:sha-${SHA} \
              --output       none

      - name: Health check pós-deploy
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            FQDN=$(az containerapp show \
              --name laudifier-production-backend \
              --resource-group rg-laudifier-production \
              --query "properties.configuration.ingress.fqdn" -o tsv)
            echo "Aguardando Container App... URL: https://${FQDN}/health/ready"
            sleep 30
            curl -f --retry 6 --retry-delay 10 "https://${FQDN}/health/ready"


  # ─── 4. Deploy Frontend → Azure Static Web Apps ─────────────────────────────
  deploy-frontend:
    name: Deploy Angular → Azure Static Web Apps
    runs-on: ubuntu-latest
    needs: [test-backend]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Criar environment.ts (substituído em prod pelo environment.prod.ts)
        run: |
          cat > src/environments/environment.ts << 'EOF'
          export const environment = { production: false, apiUrl: '', supabaseUrl: '', supabaseKey: '', appName: 'Laudifier', appVersion: '1.0.0' };
          EOF

      - name: Build Angular
        run: npm ci && npm run build

      - name: Deploy para Azure Static Web Apps
        uses: azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_DEPLOY_TOKEN }}
          repo_token:                      ${{ secrets.GITHUB_TOKEN }}
          action:                          upload
          app_location:                    "/"
          output_location:                 "dist/laudifier/browser"
          skip_api_build:                  true
