[pytest]
pythonpath = .
testpaths = backend/tests
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
addopts =
    --strict-markers
    --strict-config
    -ra
markers =
    integration: testes que batem em serviços reais (rede, disco)
    concurrency: property-based tests de concorrência (hypothesis)
    slow: testes lentos (> 1s)
filterwarnings =
    error
    ignore::DeprecationWarning:pydantic.*
    ignore::DeprecationWarning:httpx.*
    ignore::pytest.PytestDeprecationWarning
    ignore::UserWarning
